# Linter and formatter for the Python backend: `ruff check .` and
# `ruff format .` (see CLAUDE.md for the pre-commit order).
target-version = "py314"
extend-exclude = ["frontend", "data", "logs"]

[lint]
# Ruff's defaults (pyflakes F, and pycodestyle errors E4/E7/E9): unused
# imports and variables, undefined names, invalid comparisons and similar.
# Style rules such as line length are left to `ruff format`.
